services:
  dockhand:
    container_name: dockhand
    image: fnsys/dockhand:v1.0.54
    restart: unless-stopped
    networks:
      - dockhand
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

volumes:
  dockhand_data:

networks:
  dockhand:
    name: dockhand
