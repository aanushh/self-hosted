services:
  homepage:
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_ADGUARD_PUBLIC_URL: ${HOMEPAGE_VAR_ADGUARD_PUBLIC_URL}
      HOMEPAGE_VAR_ADGUARD_URL: ${HOMEPAGE_VAR_ADGUARD_URL}
      HOMEPAGE_VAR_ADGUARD_USERNAME: ${HOMEPAGE_VAR_ADGUARD_USERNAME}
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${HOMEPAGE_VAR_ADGUARD_PASSWORD}
      HOMEPAGE_VAR_BENTOPDF_PUBLIC_URL: ${HOMEPAGE_VAR_BENTOPDF_PUBLIC_URL}
      HOMEPAGE_VAR_LINKDING_PUBLIC_URL: ${HOMEPAGE_VAR_LINKDING_PUBLIC_URL}
      HOMEPAGE_VAR_SILVERBULLET_PUBLIC_URL: ${HOMEPAGE_VAR_SILVERBULLET_PUBLIC_URL}
      HOMEPAGE_VAR_WEATHER_LATITUDE: ${HOMEPAGE_VAR_WEATHER_LATITUDE}
      HOMEPAGE_VAR_WEATHER_LONGITUDE: ${HOMEPAGE_VAR_WEATHER_LONGITUDE}
      HOMEPAGE_VAR_CADDY_URL: ${HOMEPAGE_VAR_CADDY_URL}
      HOMEPAGE_VAR_CADDY_MONITORING_URL: ${HOMEPAGE_VAR_CADDY_MONITORING_URL}
      HOMEPAGE_VAR_DOCKHAND_PUBLIC_URL: ${HOMEPAGE_VAR_DOCKHAND_PUBLIC_URL}
      HOMEPAGE_VAR_DOCKHAND_USERNAME: ${HOMEPAGE_VAR_DOCKHAND_USERNAME}
      HOMEPAGE_VAR_DOCKHAND_PASSWORD: ${HOMEPAGE_VAR_DOCKHAND_PASSWORD}
      HOMEPAGE_VAR_UPTIME_KUMA_PUBLIC_URL: ${HOMEPAGE_VAR_UPTIME_KUMA_PUBLIC_URL}
      HOMEPAGE_VAR_UPTIME_KUMA_SLUG: ${HOMEPAGE_VAR_UPTIME_KUMA_SLUG}
    image: ghcr.io/gethomepage/homepage:v2.4.0
    networks:
      - homepage
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./images:/app/public/images:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  homepage:
    name: homepage
