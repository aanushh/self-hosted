services:
  homepage:
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_ADGUARD_PUBLIC_URL: ${HOMEPAGE_VAR_ADGUARD_PUBLIC_URL}
      HOMEPAGE_VAR_ADGUARD_URL: ${HOMEPAGE_VAR_ADGUARD_URL}
      HOMEPAGE_VAR_ADGUARD_USERNAME: ${HOMEPAGE_VAR_ADGUARD_USERNAME}
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${HOMEPAGE_VAR_ADGUARD_PASSWORD}
      HOMEPAGE_VAR_BENTOPDF_PUBLIC_URL: ${HOMEPAGE_VAR_BENTOPDF_PUBLIC_URL}
      HOMEPAGE_VAR_KARAKEEP_PUBLIC_URL: ${HOMEPAGE_VAR_KARAKEEP_PUBLIC_URL}
      HOMEPAGE_VAR_SILVERBULLET_PUBLIC_URL: ${HOMEPAGE_VAR_SILVERBULLET_PUBLIC_URL}
    image: ghcr.io/gethomepage/homepage:v2.4.0
    networks:
      - homepage
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./icons:/app/public/icons:ro
      - ./images:/app/public/images:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  homepage:
    name: homepage
