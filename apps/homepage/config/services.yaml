# yaml-language-server: $schema=none

- Infrastructure & Network:
    - AdGuard Home:
        id: adguard-home
        href: "{{HOMEPAGE_VAR_ADGUARD_PUBLIC_URL}}"
        icon: adguard-home.png
        description: DNS filtering and privacy protection
        siteMonitor: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        widget:
          type: adguard
          url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Dockhand:
        id: dockhand
        href: "{{HOMEPAGE_VAR_DOCKHAND_PUBLIC_URL}}"
        icon: dockhand.png
        description: Docker stack and container orchestrator
        siteMonitor: "{{HOMEPAGE_VAR_DOCKHAND_PUBLIC_URL}}"
        widget:
          type: dockhand
          url: "{{HOMEPAGE_VAR_DOCKHAND_PUBLIC_URL}}"
          username: "{{HOMEPAGE_VAR_DOCKHAND_USERNAME}}"
          password: "{{HOMEPAGE_VAR_DOCKHAND_PASSWORD}}"
          fields: ["running", "total", "pending_updates"]
    - Caddy:
        id: caddy
        icon: caddy.png
        description: Web server and Reverse proxy manager
        siteMonitor: "{{HOMEPAGE_VAR_CADDY_MONITORING_URL}}"
        widget:
          type: caddy
          url: "{{HOMEPAGE_VAR_CADDY_URL}}"

- Quick Launch:
    - AdGuard Home:
        href: "{{HOMEPAGE_VAR_ADGUARD_PUBLIC_URL}}"
        icon: adguard-home.png
    - Bento PDF:
        href: "{{HOMEPAGE_VAR_BENTOPDF_PUBLIC_URL}}"
        icon: bentopdf.png
    - Bitwarden:
        href: https://vault.bitwarden.com
        icon: bitwarden.png
    - Cloudflare:
        href: https://one.dash.cloudflare.com
        icon: cloudflared.png
    - Dockhand:
        href: "{{HOMEPAGE_VAR_DOCKHAND_PUBLIC_URL}}"
        icon: dockhand.png
    - Karakeep:
        href: "{{HOMEPAGE_VAR_KARAKEEP_PUBLIC_URL}}"
        icon: karakeep.png
    - SilverBullet:
        href: "{{HOMEPAGE_VAR_SILVERBULLET_PUBLIC_URL}}"
        icon: silverbullet.png
