- greeting:
    text: Anush's Home
- search:
    provider: google
    focus: false
    showSearchSuggestions: true
    target: _parent
- datetime:
    locale: en
    format:
      dateStyle: medium
      timeStyle: short
- openmeteo:
    latitude: 11.016
    longitude: 76.962
    cache: 30
    units: metric # or imperial
    format: # optional, Intl.NumberFormat options
      maximumFractionDigits: 1

- resources:
    cpu: true
    memory: true
    disk: /
    network: true
