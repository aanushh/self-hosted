- logo:
    icon: homepage.png
- search:
    provider: google
    focus: false
    showSearchSuggestions: true
    target: _parent
- datetime:
    locale: en
    format:
      dateStyle: medium
      timeStyle: short
- openmeteo:
    latitude: "{{HOMEPAGE_VAR_WEATHER_LATITUDE}}"
    longitude: "{{HOMEPAGE_VAR_WEATHER_LONGITUDE}}"
    cache: 30
    units: metric
    font: lg
    format:
      maximumFractionDigits: 1
- resources:
    cpu: true
    memory: true
    disk: /
    cputemp: true
    tempmin: 0
    tempmax: 100
    units: imperial
