services:
  silverbullet:
    container_name: silverbullet
    environment:
      - SB_USER=${SB_USER_NAME}:${SB_USER_PASSWORD}
      - SB_PORT=3000
      - GH_PAT=${GH_PAT:?Set GH_PAT in apps/silverbullet/.env}
    image: zefhemel/silverbullet:2.12.0
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - silverbullet
    restart: unless-stopped
    volumes:
      - $HOME/Documents/tech-codex:/space
      - ./git-credential-ghpat:/usr/local/bin/git-credential-ghpat:ro

  watchtower:
    container_name: watchtower
    command: --cleanup --interval 86400
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  silverbullet:
    name: silverbullet
