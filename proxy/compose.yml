services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:2
    container_name: caddy
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - homelab

volumes:
  caddy_data:
  caddy_config:

networks:
  homelab:
    external: true
